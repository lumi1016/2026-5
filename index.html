                let badgeClass = isStay ? 'badge-stay' : (e.type === '美食' || e.type === '體驗' || e.type === '購物' ? 'badge-food' : 'badge-spot');
                let cardClass = isStay ? 'card-stay shadow-lg' : 'bg-white shadow-sm border border-gray-100';
                html += `<div class="relative pl-8 mb-8 border-l-2 border-dashed border-gray-200 text-left text-left text-left text-left text-left text-left text-left" onclick="window.toggleTool('detail', ${d}, ${idx})"><div class="absolute -left-2 top-0 w-4 h-4 rounded-full ${isStay ? 'bg-[--osaka-gold]' : 'bg-[--kyoto-red]'} border-4 border-white shadow-md"></div><div class="${cardClass} rounded-[2.5rem] p-7 active:scale-[0.97] transition-all"><div class="flex justify-between items-center mb-4 text-left text-left text-left"><span class="${isStay ? 'bg-amber-600' : 'bg-[--bamboo-green]'} text-white text-[9px] px-3 py-1 rounded-full font-bold shadow-sm">${e.t}</span><div class="flex gap-2 text-left text-left">${e.reserved ? `<span class="bg-amber-100 text-amber-600 text-[8px] font-black px-2 py-1 rounded-lg border border-amber-200">預約</span>` : ''}<span class="${badgeClass} text-[8px] font-black px-2.5 py-1 rounded-lg">${e.type}</span></div></div><h3 class="text-xl font-bold mb-2 kaity flex items-center text-left text-left text-left text-left text-left text-left text-left text-left text-left"><i class="fas fa-${e.i || 'map-marker-alt'} mr-3 ${isStay ? 'text-[--osaka-gold]' : 'text-[--kyoto-red]'} text-lg opacity-80"></i>${e.s}</h3><p class="text-xs font-bold mb-4 line-clamp-1 opacity-80 text-left text-left text-left text-left text-left text-left text-left text-left">${e.n}</p><div class="${isStay ? 'bg-white/10' : 'bg-red-50'} px-4 py-2.5 rounded-2xl text-[10px] font-black border border-white/20 flex items-center justify-between text-left text-left text-left text-left text-left text-left"><span><i class="fas fa-eye mr-2"></i>${isStay ? '查看飯店特色' : '查看詳情攻略'}</span><i class="fas fa-chevron-right text-[8px] opacity-40"></i></div></div></div>`;
            });
            document.getElementById('main-content').innerHTML = html + `</div>`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.onload = async () => {
            const nav = document.getElementById('day-nav-container'), dayNames = ["第一日", "第二日", "第三日", "第四日", "第五日", "第六日"];
            nav.innerHTML = dayNames.map((n, i) => `<button onclick="window.switchDay(${i+1})" id="tab${i+1}" class="px-8 py-3 rounded-[1.5rem] bg-white text-gray-400 shadow-sm border border-gray-100 font-black transition-all text-xs text-center text-left text-left text-left text-left text-left">${n}</button>`).join('');
            window.switchDay(1);
            const rateRes = await fetch('https://open.er-api.com/v6/latest/JPY');
            if (rateRes.ok) { const rateData = await rateRes.json(); exchangeRate = rateData.rates.TWD; }
        };
    </script>
</body>
</html>
